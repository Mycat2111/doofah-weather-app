<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- DooFah app icon: a sun behind a cloud on a clear-day sky. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#6cc6ff"/>
      <stop offset="0.48" stop-color="#2f86e8"/>
      <stop offset="1" stop-color="#1a3c96"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.33" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#fff3c4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe98f"/>
      <stop offset="1" stop-color="#f9b224"/>
    </linearGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="154" x2="0" y2="372">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="shape"><rect id="frame" width="512" height="512" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <g id="art" transform="translate(-6 14)">
      <circle cx="334" cy="186" r="86" fill="url(#sun)"/>
      <g fill="#0b2a6b" opacity="0.28" filter="url(#shadow)" transform="translate(0 18)">
        <rect x="112" y="268" width="300" height="104" rx="52"/>
        <circle cx="206" cy="276" r="64"/>
        <circle cx="286" cy="240" r="86"/>
      </g>
      <g fill="url(#cloud)">
        <rect x="112" y="268" width="300" height="104" rx="52"/>
        <circle cx="206" cy="276" r="64"/>
        <circle cx="286" cy="240" r="86"/>
      </g>
    </g>
  </g>
</svg>
