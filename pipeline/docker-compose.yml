# A local PostGIS for the pipeline and its tests:
#   docker compose -f pipeline/docker-compose.yml up -d
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:54329/postgres uv run pytest
# Apply supabase/migrations/20261006130000_wx_schema.sql to a database here before running the job.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - postgis:/var/lib/postgresql/data

volumes:
  postgis:
