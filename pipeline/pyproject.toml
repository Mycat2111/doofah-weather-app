[project]
name = "doofah-pipeline"
version = "0.1.0"
description = "DooFah v2 forecast pipeline: loads model runs into PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.0",
  "omfiles>=1.2",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doofah_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads Open-Meteo's real bucket (run with WX_LIVE=1)"]
